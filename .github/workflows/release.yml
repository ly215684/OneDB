name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: '--config src-tauri/tauri.release.conf.json'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Linux system dependencies ──
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      # ── Node.js ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── Rust ──
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ── Rust cache ──
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # ── Install npm dependencies ──
      - name: Install dependencies
        run: npm ci

      # ── Stage VC++ runtime DLLs (Windows) ──
      # DuckDB (bundled) is compiled with MSVC and dynamically links vcruntime140.dll /
      # msvcp140.dll. We copy the redistributable CRT DLLs next to the binary and write
      # a Tauri config override (tauri.release.conf.json) that lists them as bundle
      # `resources`. The override is passed via the Windows matrix `args: --config ...`
      # so ONLY the Windows build bundles them — putting `resources` in the committed
      # tauri.conf.json would break macOS/Linux builds (Tauri errors on a glob that
      # matches no files). The portable archive also pulls DLLs from src-tauri/vcredist.
      - name: Stage VC++ runtime DLLs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -property installationPath
          $redistRoot = Join-Path $installPath 'VC\Redist'
          # Recursively locate the x64 CRT folder. The intermediate version dir naming
          # differs across VS versions (e.g. 14.40.33807 vs a v145 dir that lacks x64),
          # so don't assume a fixed structure — search for Microsoft.VC*.CRT directly.
          $candidates = Get-ChildItem -Path $redistRoot -Recurse -Directory -Filter 'Microsoft.VC*.CRT' -ErrorAction SilentlyContinue
          $crtDir = $candidates | Where-Object { $_.Parent.Name -eq 'x64' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crtDir) {
            $crtDir = $candidates | Where-Object { Test-Path (Join-Path $_.FullName 'vcruntime140.dll') } | Sort-Object FullName -Descending | Select-Object -First 1
          }
          if (-not $crtDir) { throw "Could not locate VC++ x64 CRT redist under $redistRoot" }
          Write-Host "VC++ CRT dir: $($crtDir.FullName)"
          New-Item -ItemType Directory -Force -Path "src-tauri\vcredist" | Out-Null
          New-Item -ItemType Directory -Force -Path "src-tauri\target\release" | Out-Null
          Copy-Item "$($crtDir.FullName)\*.dll" "src-tauri\vcredist\" -Force
          Copy-Item "$($crtDir.FullName)\*.dll" "src-tauri\target\release\" -Force
          '{"bundle":{"resources":["vcredist/*.dll"]}}' | Set-Content -Path "src-tauri\tauri.release.conf.json" -Encoding utf8
          Write-Host "Staged DLLs:"
          Get-ChildItem "src-tauri\vcredist\*.dll" | Select-Object -ExpandProperty Name

      # ── Build & bundle ──
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'OneDB ${{ github.ref_name }}'
          releaseBody: |
            ## OneDB ${{ github.ref_name }}

            ### Downloads
            | Platform | File |
            |----------|------|
            | Windows  | `.exe` (NSIS installer), `.msi`, or `onedb-portable-*-windows-x64.zip` (免安装版，含 VC++ 运行时) |
            | macOS    | `.dmg` (Apple Silicon & Intel) |
            | Linux    | `.deb` or `.AppImage` |

            See assets below for download links.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # ── Windows portable build ──
      - name: Create portable archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "portable-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "src-tauri\target\release\onedb.exe" "$stage\" -Force
          Copy-Item "src-tauri\vcredist\*.dll" "$stage\" -Force
          Compress-Archive -Path "$stage\*" -DestinationPath "onedb-portable-${{ github.ref_name }}-windows-x64.zip" -Force

      # ── Upload portable to release ──
      - name: Upload portable release asset
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: onedb-portable-${{ github.ref_name }}-windows-x64.zip
