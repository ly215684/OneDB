name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Linux system dependencies ──
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      # ── Node.js ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── Rust ──
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ── Rust cache ──
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # ── Install npm dependencies ──
      - name: Install dependencies
        run: npm ci

      # ── Stage VC++ runtime DLLs (Windows) ──
      # DuckDB (bundled) is compiled with MSVC and dynamically links vcruntime140.dll /
      # msvcp140.dll. We copy the redistributable CRT DLLs and PATCH tauri.conf.json
      # in-place so that the Tauri bundler picks them up as `bundle.resources`.
      #
      # Why patch the config instead of committing `resources`?
      #   - `resources` with a glob that matches nothing FAILS the Tauri build on
      #     macOS/Linux (where vcredist/ is absent).
      #   - We use Tauri's resource MAP syntax (`{src: dst}`) so the DLLs are FLATTENED
      #     into the install dir (next to onedb.exe), NOT into a `vcredist/` subfolder.
      #     Windows DLL loader won't search subdirectories — the DLLs MUST sit beside
      #     the exe.
      #
      # The map is built dynamically from the actual DLLs found in the CRT redist
      # so it stays robust across VS versions.
      - name: Stage VC++ runtime DLLs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -property installationPath
          $redistRoot = Join-Path $installPath 'VC\Redist'
          $candidates = Get-ChildItem -Path $redistRoot -Recurse -Directory -Filter 'Microsoft.VC*.CRT' -ErrorAction SilentlyContinue
          $crtDir = $candidates | Where-Object { $_.Parent.Name -eq 'x64' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crtDir) {
            $crtDir = $candidates | Where-Object { Test-Path (Join-Path $_.FullName 'vcruntime140.dll') } | Sort-Object FullName -Descending | Select-Object -First 1
          }
          if (-not $crtDir) { throw "Could not locate VC++ x64 CRT redist under $redistRoot" }
          Write-Host "VC++ CRT dir: $($crtDir.FullName)"

          # Copy DLLs next to the exe (for portable archive) and to vcredist/ (for resources)
          New-Item -ItemType Directory -Force -Path "src-tauri\vcredist" | Out-Null
          New-Item -ItemType Directory -Force -Path "src-tauri\target\release" | Out-Null
          Copy-Item "$($crtDir.FullName)\*.dll" "src-tauri\vcredist\" -Force
          Copy-Item "$($crtDir.FullName)\*.dll" "src-tauri\target\release\" -Force

          # Build a resource MAP object: { "vcredist/<name>.dll": "<name>.dll", ... }
          # This flattens DLLs to the install root (next to onedb.exe).
          $dllFiles = Get-ChildItem "src-tauri\vcredist\*.dll" | Sort-Object Name
          $resourceMap = [ordered]@{}
          foreach ($f in $dllFiles) {
            $resourceMap["vcredist/$($f.Name)"] = $f.Name
          }
          Write-Host "Resource map:"
          $resourceMap | ConvertTo-Json -Compress

          # Patch tauri.conf.json: set bundle.resources to the map
          $cfgPath = "src-tauri\tauri.conf.json"
          $cfg = Get-Content $cfgPath -Raw | ConvertFrom-Json
          $cfg.bundle | Add-Member -NotePropertyName resources -NotePropertyValue $resourceMap -Force
          $cfg | ConvertTo-Json -Depth 10 | Set-Content $cfgPath -Encoding utf8

          Write-Host "Patched tauri.conf.json bundle.resources:"
          (Get-Content $cfgPath -Raw | ConvertFrom-Json).bundle.resources | ConvertTo-Json -Compress

      # ── Build & bundle ──
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'OneDB ${{ github.ref_name }}'
          releaseBody: |
            ## OneDB ${{ github.ref_name }}

            ### Downloads
            | Platform | File |
            |----------|------|
            | Windows  | `.exe` (NSIS installer), `.msi`, or `onedb-portable-*-windows-x64.zip` (免安装版，含 VC++ 运行时) |
            | macOS    | `.dmg` (Apple Silicon & Intel) |
            | Linux    | `.deb` or `.AppImage` |

            See assets below for download links.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # ── Verify bundling (Windows) ──
      # Confirm the patched config and staged DLLs are visible after the build.
      - name: Verify DLLs are staged for bundling (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "=== DLLs staged in vcredist/ ==="
          Get-ChildItem "src-tauri\vcredist\*.dll" -ErrorAction SilentlyContinue | Format-Table Name, Length
          Write-Host ""
          Write-Host "=== DLLs next to onedb.exe ==="
          Get-ChildItem "src-tauri\target\release\*.dll" -ErrorAction SilentlyContinue | Format-Table Name, Length
          Write-Host ""
          Write-Host "=== Patched tauri.conf.json bundle.resources ==="
          $cfg = Get-Content "src-tauri\tauri.conf.json" -Raw | ConvertFrom-Json
          $cfg.bundle.resources | ConvertTo-Json -Compress
          Write-Host ""
          Write-Host "=== NSIS bundle output ==="
          Get-ChildItem "src-tauri\target\release\bundle\nsis\" -ErrorAction SilentlyContinue -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      # ── Windows portable build ──
      - name: Create portable archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "portable-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "src-tauri\target\release\onedb.exe" "$stage\" -Force
          Copy-Item "src-tauri\vcredist\*.dll" "$stage\" -Force
          Compress-Archive -Path "$stage\*" -DestinationPath "onedb-portable-${{ github.ref_name }}-windows-x64.zip" -Force

      # ── Upload portable to release ──
      - name: Upload portable release asset
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: onedb-portable-${{ github.ref_name }}-windows-x64.zip
